name: family_task
description: "Family Task – Nhắc Việc Gia Đình Thông Minh"
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  path: ^1.9.0
  provider: ^6.1.2
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.3
  table_calendar: ^3.1.2
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.2
  timezone: ^0.9.4
  image_picker: ^1.1.2
  uuid: ^4.4.2
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  ios: true
  android: false
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
